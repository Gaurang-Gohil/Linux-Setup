# Lock screen (hyprlock). Stacked clock, now playing, frosted password pill.
# Previous versions: hyprlock.conf.v1.bak (first redesign), hyprlock.conf.bak (original)
source = $HOME/.config/hypr/wallust/wallust-hyprland.conf
$Info  = $HOME/.config/hypr/scripts/LockInfo.sh
$font  = Inter Display
$text  = rgba(255, 255, 255, 0.95)
$dim   = rgba(255, 255, 255, 0.6)

general {
    fractional_scaling = 2
    immediate_render = true
    hide_cursor = true
}

animations {
    enabled = true
    bezier = soft, 0.22, 1, 0.36, 1
    animation = fadeIn, 1, 6, soft
    animation = fadeOut, 1, 4, soft
    animation = inputFieldDots, 1, 2, soft
    animation = inputFieldColors, 1, 4, soft
}

background {
    monitor =
    path = $HOME/.config/hypr/wallpaper_effects/.wallpaper_current
    color = $background
    blur_size = 8
    blur_passes = 3
    noise = 0.012
    contrast = 0.9
    brightness = 0.5
    vibrancy = 0.2
    vibrancy_darkness = 0.0
}

# ---------------------------------------------------------------- clock (stacked)
label {
    monitor =
    text = cmd[update:1000] date +'%I'
    color = $text
    font_size = 150
    font_family = Inter Display ExtraBold
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.35)
    position = 0, 300
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:1000] date +'%M'
    color = $color12
    font_size = 150
    font_family = Inter Display ExtraLight
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.35)
    position = 0, 105
    halign = center
    valign = center
}

# date, spaced capitals
label {
    monitor =
    text = cmd[update:60000] echo "<span letter_spacing='4000'>$(date +'%A · %-d %B' | tr a-z A-Z)</span>"
    color = $dim
    font_size = 14
    font_family = $font
    position = 0, -20
    halign = center
    valign = center
}

# now playing (hidden when nothing plays)
label {
    monitor =
    text = cmd[update:2000] $Info media
    color = $dim
    font_size = 13
    font_family = Inter, Iosevka Nerd Font
    position = 0, -62
    halign = center
    valign = center
}

# ---------------------------------------------------------------- password
# frosted pill behind the field
shape {
    monitor =
    size = 380, 64
    color = rgba(255, 255, 255, 0.07)
    rounding = -1
    border_size = 1
    border_color = rgba(255, 255, 255, 0.12)
    position = 0, -200
    halign = center
    valign = center
    zindex = 0
}

input-field {
    monitor =
    size = 360, 50
    rounding = -1
    outline_thickness = 2
    outer_color = $color12 $color13 45deg
    inner_color = rgba(0, 0, 0, 0.25)
    font_color = $text
    font_family = $font
    check_color = $color10 $color14 45deg
    fail_color = $color9
    fail_text = <i>$FAIL</i>  ($ATTEMPTS)
    capslock_color = $color11
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    dots_rounding = -1
    fade_on_empty = false
    placeholder_text = <span foreground="##ffffff88">󰌾   Hi $USER, enter password</span>
    hide_input = false
    position = 0, -200
    halign = center
    valign = center
    zindex = 1
}

# keyboard layout + caps lock hint under the field
label {
    monitor =
    text = $LAYOUT
    color = rgba(255, 255, 255, 0.4)
    font_size = 10
    font_family = $font
    position = 0, -255
    halign = center
    valign = center
}

# ---------------------------------------------------------------- corners
label {
    monitor =
    text = cmd[update:30000] $Info battery
    color = $dim
    font_size = 13
    font_family = Inter, Iosevka Nerd Font
    position = -36, 30
    halign = right
    valign = bottom
}
label {
    monitor =
    text = cmd[update:600000] $Info weather
    color = $dim
    font_size = 13
    font_family = Inter, Iosevka Nerd Font
    position = 36, 30
    halign = left
    valign = bottom
}
label {
    monitor =
    text = cmd[update:60000] echo "󰍹   $(cat /etc/hostname)"
    color = rgba(255, 255, 255, 0.4)
    font_size = 11
    font_family = Inter, Iosevka Nerd Font
    position = 0, 30
    halign = center
    valign = bottom
}
